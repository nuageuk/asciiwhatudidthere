<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ASCII</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b0906;
    display: flex; align-items: center; justify-content: center;
  }
  #ascii {
    color: #f7f7f7;
    white-space: pre;
    font-family: 'Courier New', monospace;
    font-size: 8px;
    line-height: 8px;
  }
  #ascii, #asciiCanvas {
    transform-origin: center center;
  }
  #asciiCanvas {
    display: none;
  }
  #panel {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 14px;
    background: rgba(11, 9, 6, 0.7);
    border: 1px solid #333;
    border-radius: 6px;
    color: #f7f7f7;
    font-family: 'Courier New', monospace;
    font-size: 12px;
  }
  #panel label {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #panel select {
    background: #0b0906;
    color: #f7f7f7;
    border: 1px solid #555;
    font-family: 'Courier New', monospace;
    font-size: 12px;
  }
  #panel button {
    background: #0b0906;
    color: #f7f7f7;
    border: 1px solid #555;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    padding: 4px 8px;
    cursor: pointer;
  }
  #panel label.disabled {
    opacity: 0.5;
  }
</style>
</head>
<body>

<div id="panel">
  <label>Resolution <input type="range" id="resSlider" min="40" max="200" value="120"></label>
  <label>Color <select id="colorMode">
    <option value="mono">Mono</option>
    <option value="grey">Grey</option>
    <option value="color">Color</option>
  </select></label>
  <button id="webcamToggle">Start Webcam</button>
  <label id="bgRemoveLabel" class="disabled">
    <input type="checkbox" id="bgRemoveToggle" disabled>
    <span id="bgRemoveLabelText">Remove Background</span>
  </label>
</div>

<video id="webcamVideo" autoplay playsinline muted style="display:none;"></video>
<pre id="ascii"></pre>
<canvas id="asciiCanvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const RAMP = " .:-=+*#%@"; // dark -> dense
let RENDER_W = 120, RENDER_H = 90;

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  preserveDrawingBuffer: true   // lets us read pixels back out after rendering
});
renderer.setSize(RENDER_W, RENDER_H);
renderer.setClearColor(0x000000, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, RENDER_W / RENDER_H, 0.1, 100);
camera.position.set(2, 2, 4);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.3));
const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(3, 4, 5);
scene.add(key);
// Harlequin per-face colors (BoxGeometry face order: [+x, -x, +y, -y, +z, -z])
// for visually confirming the grey/color ASCII modes differentiate faces.
const harlequinColors = [
  0xff0033, // +x red
  0x00ffcc, // -x cyan
  0xffee00, // +y yellow
  0x9900ff, // -y purple
  0x00ff00, // +z green
  0xff6600  // -z orange
];
const cubeMats = harlequinColors.map(color =>
  new THREE.MeshStandardMaterial({ color, roughness: 0.5 })
);
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(1.4, 1.4, 1.4),
  cubeMats
);
scene.add(cube);
const sampleCanvas = document.createElement('canvas');
sampleCanvas.width = RENDER_W;
sampleCanvas.height = RENDER_H;
const sctx = sampleCanvas.getContext('2d', { willReadFrequently: true });
const asciiEl = document.getElementById('ascii');
const colorModeSelect = document.getElementById('colorMode');
const resSlider = document.getElementById('resSlider');

// Must match #ascii's font-size/line-height in the CSS above so all three
// modes (pre-based mono, canvas-based grey/color) render at the same size.
const FONT_SIZE = 8, CELL_H = 8, FONT = `${FONT_SIZE}px 'Courier New', monospace`;
const asciiCanvas = document.getElementById('asciiCanvas');
const actx = asciiCanvas.getContext('2d');
actx.font = FONT;
const CELL_W = actx.measureText('M').width; // monospace: any glyph gives the true cell width

// Keeps the on-screen footprint constant as resolution changes: more/fewer
// columns changes the output's natural (unscaled) pixel size, so we fit it
// to the viewport every time that natural size changes. Natural size is
// computed from intrinsic cell metrics (cols/rows * CELL_W/CELL_H) rather
// than getBoundingClientRect(), which would reflect an already-applied
// transform instead of the true unscaled layout size.
//
// <pre> (mono) is CSS-transform-scaled: vector text re-rasterizes cleanly
// at any transform scale. <canvas> (grey/color) must NOT be CSS-scaled --
// that would stretch an already-rasterized bitmap and blur it. Instead its
// drawing buffer is sized directly to the target on-screen size times
// devicePixelRatio, and a matching ctx.scale() bakes the fit into the
// coordinate space so fillText() calls stay expressed in the same
// cols/rows * CELL_W/CELL_H units used everywhere else.
function fitToScreen(){
  const naturalW = RENDER_W * CELL_W;
  const naturalH = RENDER_H * CELL_H;
  const margin = 0.9;
  const scale = Math.min(
    (window.innerWidth * margin) / naturalW,
    (window.innerHeight * margin) / naturalH
  );
  asciiEl.style.transform = `scale(${scale})`;

  const dpr = window.devicePixelRatio || 1;
  const dispW = naturalW * scale;
  const dispH = naturalH * scale;
  asciiCanvas.style.width = `${dispW}px`;
  asciiCanvas.style.height = `${dispH}px`;
  // assigning width/height resets the 2D context state, so re-apply it
  asciiCanvas.width = Math.round(dispW * dpr);
  asciiCanvas.height = Math.round(dispH * dpr);
  actx.font = FONT;
  actx.textBaseline = 'top';
  actx.scale(scale * dpr, scale * dpr);
}
window.addEventListener('resize', fitToScreen);
fitToScreen();

function setDisplayMode(mode){
  const isMono = mode === 'mono';
  asciiEl.style.display = isMono ? '' : 'none';
  asciiCanvas.style.display = isMono ? 'none' : 'block';
}
setDisplayMode(colorModeSelect.value);
colorModeSelect.addEventListener('change', () => setDisplayMode(colorModeSelect.value));

function resizeRenderTarget(cols){
  RENDER_W = cols;
  RENDER_H = Math.round(cols * 3 / 4); // keep ~4:3 aspect
  renderer.setSize(RENDER_W, RENDER_H);
  // Camera FOV/aspect is intentionally left untouched: RENDER_W:RENDER_H is
  // always ~4:3 by construction, so framing must stay fixed across
  // resolutions — only the render buffer's pixel density should change.
  sampleCanvas.width = RENDER_W;
  sampleCanvas.height = RENDER_H;
  fitToScreen();
}
resSlider.addEventListener('input', () => resizeRenderTarget(parseInt(resSlider.value, 10)));

const webcamVideo = document.getElementById('webcamVideo');
const webcamToggle = document.getElementById('webcamToggle');
let webcamActive = false;

async function startWebcam(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    webcamVideo.srcObject = stream;
    await webcamVideo.play();
    webcamActive = true;
    webcamToggle.textContent = 'Stop Webcam';
    setBgRemoveEnabled(true);
  } catch (err) {
    console.error(err);
    alert('Could not access webcam — check browser permissions.');
  }
}

function stopWebcam(){
  const stream = webcamVideo.srcObject;
  if (stream) stream.getTracks().forEach(t => t.stop());
  webcamVideo.srcObject = null;
  webcamActive = false;
  webcamToggle.textContent = 'Start Webcam';
  setBgRemoveEnabled(false);
  closeSegmenter();
}

webcamToggle.addEventListener('click', () => {
  if (webcamActive) stopWebcam(); else startWebcam();
});

// --- Background removal (MediaPipe Tasks Vision: selfie segmentation) ---
// A genuine external ML dependency, unlike the rest of this project (which
// is otherwise all hand-rolled three.js + canvas). Loaded lazily -- only on
// the first time the checkbox is checked, not on page load -- since it
// pulls down a WASM runtime + a real .tflite model from Google's CDN.
const BG_REMOVE_THRESHOLD = 0.5; // mask confidence below this = background/space

const bgRemoveToggle = document.getElementById('bgRemoveToggle');
const bgRemoveLabel = document.getElementById('bgRemoveLabel');
const bgRemoveLabelText = document.getElementById('bgRemoveLabelText');

let segmenter = null;
let segmenterPromise = null;
let bgRemoveActive = false;
let latestMask = null; // Float32Array of per-pixel person confidence, 0..1
let latestMaskW = 0, latestMaskH = 0;

async function loadSegmenter(){
  const { FilesetResolver, ImageSegmenter } = await import(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs"
  );
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
  );
  return ImageSegmenter.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite"
    },
    runningMode: "VIDEO",
    outputConfidenceMasks: true
  });
}

function ensureSegmenter(){
  if (segmenter) return Promise.resolve(segmenter);
  if (!segmenterPromise) {
    segmenterPromise = loadSegmenter()
      .then(s => { segmenter = s; return s; })
      .catch(err => { segmenterPromise = null; throw err; });
  }
  return segmenterPromise;
}

// MediaPipe Tasks objects (segmenter + the masks it returns) hold WASM/GPU
// resources that aren't garbage-collected automatically -- they must be
// closed explicitly. Re-loading the model on every "Start Webcam" is the
// tradeoff of closing it here rather than only on page unload; see report.
function closeSegmenter(){
  if (segmenter) {
    segmenter.close();
    segmenter = null;
  }
  segmenterPromise = null;
  latestMask = null;
}
window.addEventListener('pagehide', closeSegmenter);

function setBgRemoveEnabled(enabled){
  bgRemoveToggle.disabled = !enabled;
  bgRemoveLabel.classList.toggle('disabled', !enabled);
  if (!enabled) {
    bgRemoveToggle.checked = false;
    bgRemoveActive = false;
  }
}

bgRemoveToggle.addEventListener('change', async () => {
  if (!bgRemoveToggle.checked) {
    bgRemoveActive = false;
    return;
  }
  if (!segmenter) {
    bgRemoveToggle.disabled = true;
    bgRemoveLabelText.textContent = 'Loading segmentation model…';
    try {
      await ensureSegmenter();
    } catch (err) {
      console.error(err);
      alert('Could not load the background segmentation model.');
      bgRemoveToggle.checked = false;
      bgRemoveLabelText.textContent = 'Remove Background';
      bgRemoveToggle.disabled = !webcamActive;
      return;
    }
    bgRemoveLabelText.textContent = 'Remove Background';
    bgRemoveToggle.disabled = !webcamActive; // webcam may have been stopped while loading
  }
  bgRemoveActive = webcamActive;
});

function runSegmentation(){
  segmenter.segmentForVideo(webcamVideo, performance.now(), (result) => {
    const masks = result.confidenceMasks;
    if (masks && masks.length) {
      // Selfie segmenter is single-category (person); index 0 is its confidence mask.
      const mask = masks[0];
      latestMask = mask.getAsFloat32Array();
      latestMaskW = mask.width;
      latestMaskH = mask.height;
      masks.forEach(m => m.close());
    }
  });
}

// Maps a RENDER_W x RENDER_H cell to the (differently-sized, e.g. 256x256)
// segmentation mask -- never assume 1:1 pixel alignment with the mask.
function isBackgroundCell(x, y){
  if (!bgRemoveActive || !latestMask) return false;
  const mx = Math.min(latestMaskW - 1, Math.floor(x / RENDER_W * latestMaskW));
  const my = Math.min(latestMaskH - 1, Math.floor(y / RENDER_H * latestMaskH));
  return latestMask[my * latestMaskW + mx] < BG_REMOVE_THRESHOLD;
}

function renderToAscii(){
  // copy either the WebGL canvas or the webcam feed into a normal 2D canvas
  // so we can read its pixels; destination size always forces it to fill
  // the RENDER_W x RENDER_H sample grid regardless of the source's own size.
  const source = webcamActive ? webcamVideo : renderer.domElement;
  if (bgRemoveActive && segmenter) runSegmentation();
  sctx.drawImage(source, 0, 0, RENDER_W, RENDER_H);
  const img = sctx.getImageData(0, 0, RENDER_W, RENDER_H).data;
  const mode = colorModeSelect.value;

  if (mode === 'mono') {
    const rows = [];
    for(let y = 0; y < RENDER_H; y++){
      let line = '';
      for(let x = 0; x < RENDER_W; x++){
        if (isBackgroundCell(x, y)) { line += ' '; continue; }
        const idx = (y * RENDER_W + x) * 4; // each pixel is 4 bytes: R,G,B,A
        const lum = (0.299*img[idx] + 0.587*img[idx+1] + 0.114*img[idx+2]) / 255;
        line += RAMP[Math.min(RAMP.length - 1, Math.round(lum * (RAMP.length - 1)))];
      }
      rows.push(line);
    }
    asciiEl.textContent = rows.join('\n');
    return;
  }

  // grey/color: draw straight onto a canvas with fillText — no per-frame DOM nodes.
  // Clear in raw buffer space (transform reset) so it's correct regardless of
  // the scale*dpr transform fitToScreen() left active on the context.
  actx.save();
  actx.setTransform(1, 0, 0, 1, 0, 0);
  actx.clearRect(0, 0, asciiCanvas.width, asciiCanvas.height);
  actx.restore();
  for(let y = 0; y < RENDER_H; y++){
    for(let x = 0; x < RENDER_W; x++){
      if (isBackgroundCell(x, y)) continue;
      const idx = (y * RENDER_W + x) * 4;
      const r = img[idx], g = img[idx+1], b = img[idx+2];
      const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
      const ch = RAMP[Math.min(RAMP.length - 1, Math.round(lum * (RAMP.length - 1)))];
      if (ch === ' ') continue;
      if (mode === 'grey') {
        const v = Math.round(lum * 255);
        actx.fillStyle = `rgb(${v},${v},${v})`;
      } else {
        actx.fillStyle = `rgb(${r},${g},${b})`;
      }
      actx.fillText(ch, x * CELL_W, y * CELL_H);
    }
  }
}
function tick(){
  if (!webcamActive) {
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.015;
    renderer.render(scene, camera);
  }
  renderToAscii();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>

</body>
</html>
