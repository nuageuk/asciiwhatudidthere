<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCIIWHATUDIDTHERE</title>
<!-- script-src's hash allow-lists the app's single inline <script> block below
     (everything lives in this file, so 'self' alone can't cover it, and
     'unsafe-inline' would defeat the point of having a CSP at all). If that
     script's content ever changes, this hash must be recomputed or the app
     will silently stop executing. Two gotchas the naive version of this
     command misses: (1) a first-match regex grabs the FIRST <script>...
     <\/script>-shaped substring, and this very comment's example command
     text contains one -- take the LAST match instead; (2) CSP hash matching
     normalizes CRLF/CR to LF before hashing the element's source text, so on
     a CRLF-saved file (like this one) hashing the raw bytes gives the wrong
     digest -- normalize first:
       node -e "const fs=require('fs');const html=fs.readFileSync('index.html','utf8');const m=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];const src=m[m.length-1][1].replace(/\r\n/g,'\n').replace(/\r/g,'\n');console.log('sha256-'+require('crypto').createHash('sha256').update(src).digest('base64'))" -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'sha256-kicWNirud41YV2M+ECH9tdMOOXFDKoVnsV3aauIJjKk=' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;
  worker-src 'self' blob:;
  connect-src 'self' https://cdn.jsdelivr.net https://storage.googleapis.com;
  img-src 'self' data: blob:;
  media-src 'self' blob:;
  style-src 'self' 'unsafe-inline';
  object-src 'none'; base-uri 'none';
">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b0906;
    display: flex; align-items: center; justify-content: center;
    /* #ascii is visually shrunk via CSS transform in fitToScreen(), but
       transform doesn't shrink an element's contribution to scrollable
       overflow -- its untransformed (often much larger) box size still
       counts. Without this, the page would become scrollable to fit that
       full untransformed size, which is exactly wrong for an app that's
       meant to always fill the viewport exactly and never scroll. */
    overflow: hidden;
  }
  #ascii {
    color: #f7f7f7;
    white-space: pre;
    font-family: 'Courier New', monospace;
    font-size: 8px;
    line-height: 8px;
  }
  #ascii, #asciiCanvas {
    transform-origin: center center;
    /* Drag-to-rotate uses Pointer Events; without this a touch-drag also
       scrolls/pans the page underneath it. */
    touch-action: none;
  }
  #asciiCanvas {
    display: none;
  }
  #panel {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 14px;
    background: rgba(11, 9, 6, 0.7);
    border: 1px solid #333;
    border-radius: 6px;
    color: #f7f7f7;
    font-family: 'Courier New', monospace;
    font-size: 12px;
  }
  #panel label {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #panel select {
    background: #0b0906;
    color: #f7f7f7;
    border: 1px solid #555;
    font-family: 'Courier New', monospace;
    font-size: 12px;
  }
  #panel input[type="text"] {
    background: #0b0906;
    color: #f7f7f7;
    border: 1px solid #555;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    padding: 2px 6px;
    width: 110px;
  }
  #panel button, #actionBar button, #screenshotOverlay button {
    background: #0b0906;
    color: #f7f7f7;
    border: 1px solid #555;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    padding: 4px 8px;
    cursor: pointer;
  }
  #panel label.disabled {
    opacity: 0.5;
  }
  .mode-note {
    display: none;
    font-size: 11px;
    opacity: 0.7;
    margin-top: -4px;
  }
  .mode-note.visible {
    display: block;
  }
  #toolRow, #shapeRow {
    display: flex;
    gap: 8px;
  }
  #panel button.icon-btn, #actionBar button.icon-btn, #screenshotOverlay button.icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    line-height: 0;
  }
  #panel button.icon-btn svg, #actionBar button.icon-btn svg, #screenshotOverlay button.icon-btn svg {
    display: block;
  }
  #panel button[aria-pressed="true"], #actionBar button[aria-pressed="true"] {
    background: #2a3320;
    border-color: #7a9a5a;
  }
  #panel button:disabled, #actionBar button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  /* Always-visible bottom bar for pause/screenshot: lives outside #panel
     (see markup) as a sibling so it isn't affected by #panel's off-canvas
     translateX(-100%) drawer transform, and stays fixed to the bottom center
     of the screen at every viewport width -- not just mobile. bottom:80px
     (rather than a snugger offset) keeps it clear of #toast, which sits
     lower (bottom:16px desktop / 12px mobile) and can grow tall enough on
     wrap to otherwise overlap it. */
  #actionBar {
    display: flex;
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    gap: 10px;
    padding: 8px 10px;
    z-index: 11; /* above #backdrop (9) and #panel (10), stays tappable while the drawer is open */
    background: rgba(11, 9, 6, 0.7);
    border: 1px solid #333;
    border-radius: 6px;
  }
  #toast {
    position: fixed;
    bottom: 16px;
    left: 12px;
    z-index: 20;
    max-width: 320px;
    padding: 10px 14px;
    background: rgba(11, 9, 6, 0.9);
    border: 1px solid #a33;
    border-radius: 6px;
    color: #f7f7f7;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.4;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none; /* informational only, auto-dismisses -- never blocks clicks underneath */
  }
  #toast.visible {
    opacity: 1;
    transform: translateY(0);
  }
  #menuToggle {
    display: none; /* only shown on mobile -- see media query below */
    position: fixed;
    top: 8px;
    left: 8px;
    z-index: 12; /* above both #panel (10) and #backdrop (9), stays tappable while the drawer is open */
    background: rgba(11, 9, 6, 0.85);
    color: #f7f7f7;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 10px;
    cursor: pointer;
  }
  #backdrop {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9; /* below #panel and #menuToggle, above the ascii render */
    background: rgba(0, 0, 0, 0.5);
  }
  #screenshotOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 21; /* above everything else in the stack, including #toast (20) */
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.7);
  }
  #screenshotOverlay.open {
    display: flex;
  }
  #screenshotOverlayContent {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    max-width: 90vw;
    max-height: 90vh;
    padding: 16px;
    background: rgba(11, 9, 6, 0.9);
    border: 1px solid #555;
    border-radius: 6px;
    color: #f7f7f7;
    font-family: 'Courier New', monospace;
  }
  #screenshotOverlayClose {
    align-self: flex-end;
  }
  #screenshotOverlayImg {
    display: block;
    object-fit: contain;
    max-width: min(85vw, 480px);
    max-height: 65vh;
    border: 1px solid #333;
    border-radius: 4px;
  }
  #screenshotOverlayHint {
    margin: 0;
    font-size: 13px;
    text-align: center;
    opacity: 0.85;
  }
  @media (max-width: 600px) {
    /* Bigger text, bigger tap targets, more breathing room -- the fixed
       12px/8px sizing above is comfortable with a mouse but too cramped to
       tap reliably on a touchscreen. Roughly targets the ~44px minimum
       touch-target size most mobile guidelines recommend. */
    /* The panel becomes an off-canvas drawer on mobile instead of an
       always-visible floating overlay: it was either covering too much of
       the render or too cramped to be worth showing size for size. Hidden
       off the left edge by default, slid in via #menuToggle. Desktop's
       always-visible corner panel (the rules above this media query) is
       untouched. */
    #panel {
      top: 0;
      left: 0;
      right: auto;
      width: 82vw;
      max-width: 320px;
      height: 100vh;
      max-height: none;
      border-radius: 0;
      border-left: none;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      overflow-y: auto;
      font-size: 15px;
      gap: 14px;
      padding: 56px 16px 16px; /* top padding clears #menuToggle so it never sits over the first control */
    }
    #panel.open {
      transform: translateX(0);
    }
    #menuToggle {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #backdrop.open {
      display: block;
    }
    #panel select,
    #panel input[type="text"] {
      font-size: 15px;
      padding: 8px 10px;
    }
    #panel input[type="text"] {
      width: 140px;
    }
    #panel input[type="range"] {
      height: 28px;
    }
    #panel input[type="checkbox"] {
      width: 20px;
      height: 20px;
    }
    #panel button, #actionBar button, #screenshotOverlay button {
      font-size: 15px;
      padding: 10px 14px;
    }
    #toolRow, #shapeRow {
      gap: 12px;
    }
    #panel button.icon-btn, #actionBar button.icon-btn, #screenshotOverlay button.icon-btn {
      padding: 12px;
    }
    #panel button.icon-btn svg, #actionBar button.icon-btn svg, #screenshotOverlay button.icon-btn svg {
      width: 22px;
      height: 22px;
    }
    #toast {
      left: 8px;
      right: 8px;
      bottom: 12px;
      max-width: none;
      font-size: 14px;
    }
  }
</style>
</head>
<body>

<button id="menuToggle" title="Menu" aria-label="Open menu" aria-expanded="false">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6h18M3 12h18M3 18h18"/>
  </svg>
</button>
<div id="backdrop"></div>

<div id="panel">
  <label>Resolution <input type="range" id="resSlider" min="40" max="200" value="120"></label>
  <label>Color <select id="colorMode">
    <option value="mono">Mono</option>
    <option value="grey">Grey</option>
    <option value="color">Color</option>
  </select></label>
  <span id="colorModeNote" class="mode-note">Color unavailable with emoji character sets</span>
  <label>Chars
    <select id="rampPreset">
      <option value="default">Default</option>
      <option value="blocks">Blocks</option>
      <option value="circles">Circles</option>
      <option value="braille">Braille</option>
      <option value="custom">Custom</option>
    </select>
    <input type="text" id="rampInput" value=" .:-=+*#%@" spellcheck="false" autocomplete="off" title="Characters used dark to dense, left to right">
  </label>
  <span>Shape</span>
  <div id="shapeRow">
    <button id="shapeCube" class="icon-btn" title="Cube" aria-label="Cube" aria-pressed="true">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 8v8a1 1 0 0 1-.5.87l-8 4.6a1 1 0 0 1-1 0l-8-4.6A1 1 0 0 1 3 16V8a1 1 0 0 1 .5-.87l8-4.6a1 1 0 0 1 1 0l8 4.6A1 1 0 0 1 21 8z"/>
        <path d="M3.3 7l8.7 5 8.7-5"/>
        <path d="M12 22V12"/>
      </svg>
    </button>
    <button id="shapeSphere" class="icon-btn" title="Sphere" aria-label="Sphere" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <ellipse cx="12" cy="12" rx="9" ry="3.5"/>
        <path d="M12 3v18"/>
      </svg>
    </button>
    <button id="shapeCone" class="icon-btn" title="Cone" aria-label="Cone" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l7 16H5z"/>
        <ellipse cx="12" cy="19" rx="7" ry="2"/>
      </svg>
    </button>
    <button id="shapePyramid" class="icon-btn" title="Pyramid" aria-label="Pyramid" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l9 16H3z"/>
        <path d="M12 3l-3 16M12 3l3 16"/>
      </svg>
    </button>
  </div>
  <button id="webcamToggle">Start Webcam</button>
  <label id="bgRemoveLabel" class="disabled">
    <input type="checkbox" id="bgRemoveToggle" disabled>
    <span id="bgRemoveLabelText">Remove Background</span>
  </label>
  <div id="toolRow">
    <button id="mirrorToggle" class="icon-btn" title="Mirror webcam" aria-label="Mirror webcam" aria-pressed="true" disabled>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v18"/>
        <path d="M16 7l4 5-4 5"/>
        <path d="M8 7L4 12l4 5"/>
      </svg>
    </button>
  </div>
  <button id="copyBtn">Copy Text</button>
</div>

<div id="actionBar">
  <button id="pauseToggle" class="icon-btn" title="Pause" aria-label="Pause" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
  </button>
  <button id="screenshotBtn" class="icon-btn" title="Screenshot" aria-label="Screenshot">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8h3l2-2h6l2 2h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
      <circle cx="12" cy="14" r="3.5"/>
    </svg>
  </button>
</div>

<div id="toast" role="alert" aria-live="assertive"></div>

<div id="screenshotOverlay">
  <div id="screenshotOverlayContent">
    <button id="screenshotOverlayClose" class="icon-btn" title="Close" aria-label="Close">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
    <img id="screenshotOverlayImg" alt="ASCII screenshot">
    <p id="screenshotOverlayHint">Press and hold the image to save it</p>
  </div>
</div>

<video id="webcamVideo" autoplay playsinline muted style="display:none;"></video>
<pre id="ascii"></pre>
<canvas id="asciiCanvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"
        integrity="sha512-vnmn/Qqn6aG0POAc9mIGzjq0IybrvxJXYDafNvp9JSnDGxeF3pbkSqLvf+YGd5ku63pT7sa/jxHn7/d0mU8+tA=="
        crossorigin="anonymous"></script>
<script>
(function(){
  // Array.from (not a plain string) so multi-code-unit characters -- like
  // emoji someone might type into the Chars field, which are UTF-16
  // surrogate pairs -- count and index as one glyph each, instead of
  // RAMP[i] occasionally landing on a lone surrogate half and rendering a
  // broken glyph.
  let RAMP = Array.from(" .:-=+*#%@"); // dark -> dense; user-customizable via #rampInput
let RENDER_W = 120, RENDER_H = 90;
let paused = false;
// Mouse-drag rotation (3D preset sources only -- ignored for webcam, guarded
// the same way tick()'s auto-rotation below is). Dragging sets shape.rotation
// directly from pointer delta; releasing hands off to inertia, which decays
// to zero and then auto-rotation resumes from wherever it left off -- see tick().
let dragging = false;
let dragLastX = 0, dragLastY = 0;
let inertiaVelX = 0, inertiaVelY = 0; // radians/frame; decays after release
let inertiaActive = false;
const DRAG_ROTATE_SPEED = 0.01; // radians of rotation per pixel of drag
const INERTIA_DECAY = 0.95; // per-frame velocity multiplier -- ~1.5s to settle at 60fps
const INERTIA_MAX_VEL = 0.15; // radians/frame cap, so a fast flick stays lively but bounded
const INERTIA_STOP_THRESHOLD = 0.0005; // radians/frame below which inertia counts as settled
const AUTO_ROTATE_X = 0.01, AUTO_ROTATE_Y = 0.015; // idle auto-rotation speed, radians/frame
// Once inertia settles (or a drag is released with too little speed to ever
// trigger inertia), snapping straight to AUTO_ROTATE_X/Y reads as a sudden
// speed-up -- constant per-frame delta jumping from near-zero to full speed
// in a single frame. Blending the per-frame delta linearly from wherever it
// left off up to the auto-rotate constants over BLEND_DURATION_MS keeps the
// speed change continuous (constant "acceleration") instead of an abrupt cut.
let blending = false;
let blendStartX = 0, blendStartY = 0, blendStartTime = 0;
const BLEND_DURATION_MS = 700;
let mirrorEnabled = true; // webcam mode only; ignored for the shape source
// Normalized (0..1) crop rect within the webcam's *raw* frame that maps onto
// the RENDER_W x RENDER_H (4:3) sample grid -- see cropWebcamFrame(). Stays
// at the full-frame identity (0,0,1,1) for the shape source, which is already
// rendered at exactly 4:3 so it needs no cropping. Recomputed every frame
// webcam is active (cheap, and robust to the user swapping to a
// different-aspect camera mid-session); updateBackgroundMask() reads it too,
// so the segmentation mask (sampled from the same *raw* frame) stays aligned
// with the cropped color image instead of drifting out of registration.
let cropXNorm = 0, cropYNorm = 0, cropWNorm = 1, cropHNorm = 1;
// Set by resizeRenderTarget(); makes the next renderToAscii() frame skip EMA
// blending in both smoothing sites below and use the raw value directly.
// Cleared at the end of that same frame -- see renderToAscii().
let justResized = false;
// Plain-text snapshot of whatever's currently on screen, kept up to date every
// frame in ALL color modes (not just mono) so the Copy button always has
// something sensible to grab, and so a screenshot taken mid-pause matches it.
let lastAsciiText = '';
const PAUSE_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
const PLAY_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7 4l13 8-13 8V4z"/></svg>';

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  preserveDrawingBuffer: true   // lets us read pixels back out after rendering
});
renderer.setSize(RENDER_W, RENDER_H);
renderer.setClearColor(0x000000, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, RENDER_W / RENDER_H, 0.1, 100);
camera.position.set(2, 2, 4);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.3));
const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(3, 4, 5);
scene.add(key);
// Harlequin per-face colors (BoxGeometry face order: [+x, -x, +y, -y, +z, -z])
// for visually confirming the grey/color ASCII modes differentiate faces.
const harlequinColors = [
  0xff0033, // +x red
  0x00ffcc, // -x cyan
  0xffee00, // +y yellow
  0x9900ff, // -y purple
  0x00ff00, // +z green
  0xff6600  // -z orange
];
const cubeMats = harlequinColors.map(color =>
  new THREE.MeshStandardMaterial({ color, roughness: 0.5 })
);

// Hand-rolled checker texture (no external image asset) so the sphere's
// rotation is actually visible. A plain color or MeshNormalMaterial is
// rotationally symmetric on a sphere -- the set of normals visible from a
// fixed camera is identical no matter how it spins around its own center,
// so it would look completely static regardless of rotation speed. Painted
// wedges break that symmetry, the same way a beach ball visibly spins but
// a plain ball doesn't.
function makeCheckerTexture(){
  const cols = 8, rows = 4;
  const cellPx = 32;
  const cvs = document.createElement('canvas');
  cvs.width = cols * cellPx;
  cvs.height = rows * cellPx;
  const cctx = cvs.getContext('2d');
  const colors = [0xff0033, 0x00ffcc, 0xffee00, 0x9900ff, 0x00ff00, 0xff6600];
  for (let ry = 0; ry < rows; ry++){
    for (let rx = 0; rx < cols; rx++){
      cctx.fillStyle = '#' + colors[(rx + ry * cols) % colors.length].toString(16).padStart(6, '0');
      cctx.fillRect(rx * cellPx, ry * cellPx, cellPx, cellPx);
    }
  }
  const tex = new THREE.CanvasTexture(cvs);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// A small fixed set of primitive geometry/material pairs, built once and
// swapped onto the single `shape` mesh below rather than disposed and
// recreated per switch -- cheap low-poly primitives, no real memory
// concern keeping all four around for the session.
const SHAPES = {
  cube: {
    geometry: new THREE.BoxGeometry(1.4, 1.4, 1.4),
    material: cubeMats // one material per face, via BoxGeometry's 6 default groups
  },
  sphere: {
    geometry: new THREE.SphereGeometry(1, 32, 24),
    material: new THREE.MeshStandardMaterial({ map: makeCheckerTexture(), roughness: 0.5 })
  },
  cone: {
    // openEnded:false (default) generates the bottom cap, BUT: three.js
    // hardcodes cap material index to 1 for the top cap and 2 for the
    // bottom cap -- unconditionally, even when (as here, radiusTop=0) the
    // top cap itself is skipped entirely and never generated. A 2-entry
    // material array leaves the bottom cap's group pointing at index 2,
    // which doesn't exist, and it silently fails to render. Index 1 is
    // genuinely never read for a cone, but it's included (matching index 2)
    // so the array isn't relying on that undocumented detail to stay correct.
    geometry: new THREE.ConeGeometry(1, 1.8, 32),
    material: (() => {
      const side = new THREE.MeshStandardMaterial({ color: 0xff6600, roughness: 0.5 });
      const cap = new THREE.MeshStandardMaterial({ color: 0x9900ff, roughness: 0.5 });
      return [side, cap, cap];
    })()
  },
  pyramid: {
    // radialSegments:4 turns the same cone geometry into a square pyramid;
    // rotated 45° so a flat face reads towards camera instead of an edge.
    // Same cap material-index note as the cone above.
    geometry: new THREE.ConeGeometry(1.1, 1.8, 4).rotateY(Math.PI / 4),
    material: (() => {
      const side = new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.5 });

// Must match #ascii's font-size/line-height in the CSS above so all three
// modes (pre-based mono, canvas-based grey/color) render at the same size.
const FONT_SIZE = 8, CELL_H = 8, FONT = `${FONT_SIZE}px 'Courier New', monospace`;
const asciiCanvas = document.getElementById('asciiCanvas');
const actx = asciiCanvas.getContext('2d');
actx.font = FONT;
const CELL_W = actx.measureText('M').width; // monospace: any glyph gives the true cell width

// Keeps the on-screen footprint constant as resolution changes: more/fewer
// columns changes the output's natural (unscaled) pixel size, so we fit it
// to the viewport every time that natural size changes. Natural size is
// computed from intrinsic cell metrics (cols/rows * CELL_W/CELL_H) rather
// than getBoundingClientRect(), which would reflect an already-applied
// transform instead of the true unscaled layout size.
//
// <pre> (mono) is CSS-transform-scaled: vector text re-rasterizes cleanly
// at any transform scale. <canvas> (grey/color) must NOT be CSS-scaled --
// that would stretch an already-rasterized bitmap and blur it. Instead its
// drawing buffer is sized directly to the target on-screen size times
// devicePixelRatio, and a matching ctx.scale() bakes the fit into the
// coordinate space so fillText() calls stay expressed in the same
// cols/rows * CELL_W/CELL_H units used everywhere else.
function fitToScreen(){
  const naturalW = RENDER_W * CELL_W;
  const naturalH = RENDER_H * CELL_H;
  const margin = 0.9;
  const scale = Math.min(
    (window.innerWidth * margin) / naturalW,
    (window.innerHeight * margin) / naturalH
  );
  asciiEl.style.transform = `scale(${scale})`;

  const dpr = window.devicePixelRatio || 1;
  const dispW = naturalW * scale;
  const dispH = naturalH * scale;
  asciiCanvas.style.width = `${dispW}px`;
  asciiCanvas.style.height = `${dispH}px`;
  // assigning width/height resets the 2D context state, so re-apply it
  asciiCanvas.width = Math.round(dispW * dpr);
  asciiCanvas.height = Math.round(dispH * dpr);
  actx.font = FONT;
  actx.textBaseline = 'top';
  actx.scale(scale * dpr, scale * dpr);
}
window.addEventListener('resize', fitToScreen);
fitToScreen();

// Mono mode's fast path renders via a native <pre> (real DOM text layout,
// cheaper than per-character canvas fillText -- see the Limitations section
// of the README). That only stays visually aligned if every character in
// the active ramp shares one true monospace advance width. Plain ASCII does
// in Courier New; symbols like the circles/braille presets generally aren't
// in that font at all, so the browser silently substitutes a fallback font
// per glyph with its own (different) width, and the grid drifts out of
// alignment line by line. Canvas rendering doesn't have this problem --
// fillText() draws each character at a fixed x*CELL_W position regardless
// of that glyph's own width -- so whenever the ramp isn't ASCII-safe, mono
// mode falls back to it too instead of staying on the native-text path.
function isAsciiSafeRamp(){
  return RAMP.every(ch => ch.codePointAt(0) < 128);
}
function setDisplayMode(mode){
  const useNativeText = mode === 'mono' && isAsciiSafeRamp();
  asciiEl.style.display = useNativeText ? '' : 'none';
  asciiCanvas.style.display = useNativeText ? 'none' : 'block';
}
setDisplayMode(colorModeSelect.value);
colorModeSelect.addEventListener('change', () => setDisplayMode(colorModeSelect.value));

// Mirrors isAsciiSafeRamp()'s detection pattern above, but gates color mode
// instead of the native-text path. Emoji glyphs ignore fillStyle-based
// tinting entirely -- a color-presentation emoji's bitmap already carries its
// own color, so color mode buys nothing visually -- while fillText() of those
// glyphs is dramatically more expensive per character than plain text, enough
// to near-freeze the frame rate at normal grid resolutions.
const EMOJI_RAMP_REGEX = /\p{Extended_Pictographic}/u;
function rampHasEmoji(){
  return RAMP.some(ch => EMOJI_RAMP_REGEX.test(ch));
}
const colorModeOption = colorModeSelect.querySelector('option[value="color"]');
const colorModeNote = document.getElementById('colorModeNote');
function updateColorModeAvailability(){
  const blocked = rampHasEmoji();
  colorModeOption.disabled = blocked;
  colorModeNote.classList.toggle('visible', blocked);
  if (blocked && colorModeSelect.value === 'color') colorModeSelect.value = 'grey';
  setDisplayMode(colorModeSelect.value);
}
updateColorModeAvailability();

// Preset ramps live alongside the free-text field rather than replacing it:
// picking one just fills the field with that string (so it's fully visible
// and still editable), and typing something that doesn't match any preset
// flips the dropdown to "Custom" so it never shows a stale preset name for
// text the person has since changed. No emoji preset -- every character
// here shares one fixed 8px monospace cell (CELL_W is measured once off a
// plain 'M' glyph and reused for the whole grid), and color/proportional
// emoji glyphs don't downscale cleanly to that: they render wider than
// their cell and collide with neighbors, and are markedly slower for the
// canvas to draw per-frame. Blocks/braille/circles are plain single-width
// text symbols (Emoji_Presentation=No -- rendered as ordinary monochrome
// glyphs, not substituted with a color emoji font), so none of that
// applies to them. A person can still type actual emoji into the field
// themselves if they want that look and don't mind the tradeoff.
const RAMP_PRESETS = {
  default: " .:-=+*#%@",
  blocks: " ░▒▓█",
  circles: " ○◔◑◕●",
  braille: " ⠁⠃⠇⠏⠟⠿⣿"
};
const rampPreset = document.getElementById('rampPreset');
const rampInput = document.getElementById('rampInput');

// Any non-empty string works as a ramp -- RAMP.length-1 stays >= 0 as long
// as there's at least one character, so a single-char ramp (every cell the
// same glyph) is valid too, just visually uninteresting. An empty field is
// the only thing rejected, since it'd divide by zero below; the last valid
// ramp just stays in effect until the person types something again.
function applyRamp(str){
  if (str.length === 0) return;
  // Space is always the darkest (index 0) character, regardless of what the
  // person typed, so black areas render as blank instead of a solid glyph.
  // Prepended rather than shown in the field itself, so it doesn't fight
  // with what they're typing or move their cursor mid-edit.
  RAMP = Array.from(str.startsWith(' ') ? str : ' ' + str);
  updateColorModeAvailability();
}

rampPreset.addEventListener('change', () => {
  if (rampPreset.value === 'custom') return; // no string of its own to apply
  const preset = RAMP_PRESETS[rampPreset.value];
  rampInput.value = preset;

});

rampInput.addEventListener('input', () => {
  applyRamp(rampInput.value); // also re-applies display mode -- see updateColorModeAvailability()
  const matchedPreset = Object.keys(RAMP_PRESETS).find(key => RAMP_PRESETS[key] === rampInput.value);
  rampPreset.value = matchedPreset || 'custom';
});

function resizeRenderTarget(cols){
  RENDER_W = cols;
  RENDER_H = Math.round(cols * 3 / 4); // keep ~4:3 aspect
  renderer.setSize(RENDER_W, RENDER_H);
  // Camera FOV/aspect is intentionally left untouched: RENDER_W:RENDER_H is
  // always ~4:3 by construction, so framing must stay fixed across
  // resolutions — only the render buffer's pixel density should change.
  sampleCanvas.width = RENDER_W;
  sampleCanvas.height = RENDER_H;
  // stale-length arrays would misbehave (wrong indexing) once RENDER_W/H change
  smoothedMask = new Float32Array(RENDER_W * RENDER_H);
  personState = new Uint8Array(RENDER_W * RENDER_H);
  despeckledPerson = new Uint8Array(RENDER_W * RENDER_H);
  smoothedLum = new Float32Array(RENDER_W * RENDER_H);
  // See justResized below: the very next frame skips EMA blending entirely
  // and snaps straight to the freshly-computed value, instead of easing up
  // from these zero-filled arrays over several frames (which read as a
  // flicker to black) or carrying the old resolution's shape forward
  // stretched onto the new grid (which reads as a brief warp instead).
  justResized = true;
  fitToScreen();
}

// Drag-to-rotate the active shape. Only meaningful for the 3D preset source,
// not the webcam feed, so it's gated by the same !webcamActive check tick()
// uses for auto-rotation. Wired to both display surfaces -- #ascii and
// #asciiCanvas -- since only one is ever visible at a time (setDisplayMode()),
// so this keeps working across mono/grey/color switches without re-binding.
function beginAutoRotateBlend(fromX, fromY, now){
  blending = true;
  blendStartX = fromX;
  blendStartY = fromY;
  blendStartTime = now;
}
function handlePointerDown(e){
  if (webcamActive) return;
  dragging = true;
  inertiaActive = false;
  blending = false;
  inertiaVelX = 0; inertiaVelY = 0;
  dragLastX = e.clientX;
  dragLastY = e.clientY;
  e.target.setPointerCapture(e.pointerId);
}
function handlePointerMove(e){
  if (!dragging) return;
  const dx = e.clientX - dragLastX;
  const dy = e.clientY - dragLastY;
  dragLastX = e.clientX;
  dragLastY = e.clientY;
  const rotY = dx * DRAG_ROTATE_SPEED;
  const rotX = dy * DRAG_ROTATE_SPEED;
  shape.rotation.y += rotY;
  shape.rotation.x += rotX;
  // Kept live during the drag (not just set once on release) so a pointerup
  // right after a fast flick still carries that flick's speed into inertia,
  // instead of whatever the final, possibly near-stationary, move was.
  inertiaVelX = Math.max(-INERTIA_MAX_VEL, Math.min(INERTIA_MAX_VEL, rotX));
  inertiaVelY = Math.max(-INERTIA_MAX_VEL, Math.min(INERTIA_MAX_VEL, rotY));
}
function handlePointerUp(e){
  if (!dragging) return;
  dragging = false;
  if (Math.abs(inertiaVelX) > INERTIA_STOP_THRESHOLD || Math.abs(inertiaVelY) > INERTIA_STOP_THRESHOLD) {
    inertiaActive = true;
  } else {
    // Released with too little speed to ever cross the inertia threshold --
    // still blend up from that speed instead of jumping straight to
    // auto-rotation (see BLEND_DURATION_MS above).
    beginAutoRotateBlend(inertiaVelX, inertiaVelY, performance.now());
  }
}
[asciiEl, asciiCanvas].forEach(el => {
  el.addEventListener('pointerdown', handlePointerDown);
  el.addEventListener('pointermove', handlePointerMove);
  el.addEventListener('pointerup', handlePointerUp);
  el.addEventListener('pointercancel', handlePointerUp);
});

// --- Background removal (MediaPipe Tasks Vision: selfie segmentation) ---
// A genuine external ML dependency, unlike the rest of this project (which
// is otherwise all hand-rolled three.js + canvas). Loaded lazily -- only on
// the first time the checkbox is checked, not on page load -- since it
// pulls down a WASM runtime + a real .tflite model from Google's CDN.
// Raw per-frame mask confidence flips cells on/off near the decision boundary
// even on a static scene ("mask jitter"). Smoothed with an exponential
// moving average, plus hysteresis (different on/off thresholds) so a value
// hovering near one boundary doesn't oscillate.
const MASK_SMOOTH_KEEP = 0.75; // EMA weight kept from the previous smoothed value
const MASK_SMOOTH_NEW = 0.25;  // EMA weight given to this frame's raw mask value
const MASK_ON_THRESHOLD = 0.7;  // smoothed confidence needed for a cell to become "person"
const MASK_OFF_THRESHOLD = 0.3; // smoothed confidence a "person" cell must drop below to become background
const MASK_DESPECKLE_MAJORITY = 5; // of 9 (self + 8 neighbors) "person" votes needed to render as person

// Separate from MASK_SMOOTH_*/smoothedMask above: this smooths per-cell raw
// luminance (camera sensor noise flips a cell's chosen RAMP character every
// frame even on a static scene), not segmentation confidence. Independently
// tunable -- lighter than the mask smoothing since it needs to track real
// brightness changes (someone moving into frame), not just settle on static.
const LUM_SMOOTH_KEEP = 0.6; // EMA weight kept from the previous smoothed luminance
const LUM_SMOOTH_NEW = 0.4;  // EMA weight given to this frame's raw luminance

const bgRemoveToggle = document.getElementById('bgRemoveToggle');
const bgRemoveLabel = document.getElementById('bgRemoveLabel');
const bgRemoveLabelText = document.getElementById('bgRemoveLabelText');

let segmenter = null;
let segmenterPromise = null;
let bgRemoveActive = false;
let latestMask = null; // Float32Array of per-pixel person confidence, 0..1
let latestMaskW = 0, latestMaskH = 0;
// Per-ASCII-cell (RENDER_W x RENDER_H, not mask-resolution) smoothing state.
// Reallocated in resizeRenderTarget() whenever RENDER_W/RENDER_H change.
let smoothedMask = new Float32Array(RENDER_W * RENDER_H);
let personState = new Uint8Array(RENDER_W * RENDER_H);
// Despeckled (3x3-majority-filtered) copy of personState, used for the
// actual render decision -- see updateBackgroundMask().
let despeckledPerson = new Uint8Array(RENDER_W * RENDER_H);
// EMA-smoothed per-cell luminance (webcam source only -- see LUM_SMOOTH_*
// above). Unrelated to smoothedMask: this smooths raw sensor brightness,
// not segmentation confidence.
let smoothedLum = new Float32Array(RENDER_W * RENDER_H);

// Pinned to 1.0.0 (the current stable npm dist-tag as of writing) instead of
// @latest -- SRI isn't available for dynamic import(), so a fixed version is
// the only way to keep this from changing under us; CSP's script-src/connect-src
// restrict it to jsdelivr regardless.
const MEDIAPIPE_VERSION = "1.0.0";

async function loadSegmenter(){
  const { FilesetResolver, ImageSegmenter } = await import(
    `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MEDIAPIPE_VERSION}/vision_bundle.mjs`
  );
  const vision = await FilesetResolver.forVisionTasks(
    `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MEDIAPIPE_VERSION}/wasm`
  );
  return ImageSegmenter.createFromOptions(vision, {
    baseOptions: {
      // "/1/" is a real versioned path on this bucket (confirmed alongside
      // "/latest/", same md5 -- both point at the same 2023-05-07 upload),
      // used here instead of "/latest/" so the model can't change under us.
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/1/selfie_segmenter.tflite"
    },
    runningMode: "VIDEO",
    outputConfidenceMasks: true
  });
}

function ensureSegmenter(){
  if (segmenter) return Promise.resolve(segmenter);
  if (!segmenterPromise) {
    segmenterPromise = loadSegmenter()
      .then(s => { segmenter = s; return s; })
      .catch(err => { segmenterPromise = null; throw err; });
  }
  return segmenterPromise;
}

// MediaPipe Tasks objects (segmenter + the masks it returns) hold WASM/GPU
// resources that aren't garbage-collected automatically -- they must be
// closed explicitly. Re-loading the model on every "Start Webcam" is the
// tradeoff of closing it here rather than only on page unload; see report.
function closeSegmenter(){
  if (segmenter) {
    segmenter.close();
    segmenter = null;
  }
  segmenterPromise = null;
  latestMask = null;
}
window.addEventListener('pagehide', closeSegmenter);

function setBgRemoveEnabled(enabled){
  bgRemoveToggle.disabled = !enabled;
  bgRemoveLabel.classList.toggle('disabled', !enabled);
  if (!enabled) {
    bgRemoveToggle.checked = false;
    bgRemoveActive = false;
  }
}

bgRemoveToggle.addEventListener('change', async () => {
  if (!bgRemoveToggle.checked) {
    bgRemoveActive = false;
    return;
  }
  if (!segmenter) {
    bgRemoveToggle.disabled = true;
    bgRemoveLabelText.textContent = 'Loading segmentation model…';
    try {
      await ensureSegmenter();
    } catch (err) {
      console.error(err);
      showToast('Could not load the background segmentation model.');
      bgRemoveToggle.checked = false;
      bgRemoveLabelText.textContent = 'Remove Background';
      bgRemoveToggle.disabled = !webcamActive;
      return;
    }
    bgRemoveLabelText.textContent = 'Remove Background';
    bgRemoveToggle.disabled = !webcamActive; // webcam may have been stopped while loading
  }
  bgRemoveActive = webcamActive;
});

function runSegmentation(){
  segmenter.segmentForVideo(webcamVideo, performance.now(), (result) => {
    const masks = result.confidenceMasks;
    if (masks && masks.length) {
      // Selfie segmenter is single-category (person); index 0 is its confidence mask.
      const mask = masks[0];
      latestMask = mask.getAsFloat32Array();
      latestMaskW = mask.width;
      latestMaskH = mask.height;
      masks.forEach(m => m.close());
    }
  });
}

// Refreshes personState for every cell from the latest mask (bilinear
// sample + EMA smoothing + hysteresis -- see MASK_SMOOTH_*/MASK_ON_THRESHOLD/
// MASK_OFF_THRESHOLD above), then despeckles it with a 3x3 majority filter
// into despeckledPerson, which is what isBackgroundCell() actually reads.
// Despeckling is a separate full pass (not folded into the per-cell mask
// update above, and not done in place) because a cell's neighbors must all
// still hold *this frame's* pre-filter personState when their vote is
// counted -- filtering in place would let an already-filtered neighbor's
// result bleed into the next cell's count within the same pass.
function updateBackgroundMask(){
  if (!bgRemoveActive || !latestMask) return;

  for(let y = 0; y < RENDER_H; y++){
    for(let x = 0; x < RENDER_W; x++){
      // Sample position in mask space, using pixel-center convention so
      // cell centers map to mask-pixel centers instead of being off by
      // half a pixel. Cell (x,y) first maps into the crop window (see
      // renderToAscii's cropXNorm/cropYNorm/cropWNorm/cropHNorm), then into
      // full-frame normalized coords, since the mask itself was computed
      // from the *uncropped* raw frame.
      const fullNormX = cropXNorm + (x + 0.5) / RENDER_W * cropWNorm;
      const fullNormY = cropYNorm + (y + 0.5) / RENDER_H * cropHNorm;
      const fx = fullNormX * latestMaskW - 0.5;
      const fy = fullNormY * latestMaskH - 0.5;
      const x0 = Math.floor(fx), y0 = Math.floor(fy);
      const tx = fx - x0, ty = fy - y0;
      const x0c = Math.min(latestMaskW - 1, Math.max(0, x0));
      const x1c = Math.min(latestMaskW - 1, Math.max(0, x0 + 1));
      const y0c = Math.min(latestMaskH - 1, Math.max(0, y0));
      const y1c = Math.min(latestMaskH - 1, Math.max(0, y0 + 1));
      const v00 = latestMask[y0c * latestMaskW + x0c];
      const v10 = latestMask[y0c * latestMaskW + x1c];
      const v01 = latestMask[y1c * latestMaskW + x0c];
      const v11 = latestMask[y1c * latestMaskW + x1c];
      const top = v00 + (v10 - v00) * tx;
      const bottom = v01 + (v11 - v01) * tx;
      const rawMaskValue = top + (bottom - top) * ty;

      const i = y * RENDER_W + x;
      smoothedMask[i] = justResized ? rawMaskValue : (smoothedMask[i] * MASK_SMOOTH_KEEP + rawMaskValue * MASK_SMOOTH_NEW);
      if (personState[i] === 0 && smoothedMask[i] > MASK_ON_THRESHOLD) personState[i] = 1;
      else if (personState[i] === 1 && smoothedMask[i] < MASK_OFF_THRESHOLD) personState[i] = 0;
    }
  }

  for(let y = 0; y < RENDER_H; y++){
    const yPrev = Math.max(0, y - 1), yNext = Math.min(RENDER_H - 1, y + 1);
    for(let x = 0; x < RENDER_W; x++){
      const xPrev = Math.max(0, x - 1), xNext = Math.min(RENDER_W - 1, x + 1);
      let votes = 0;
      for(let ny = yPrev; ny <= yNext; ny++){
        const row = ny * RENDER_W;
        for(let nx = xPrev; nx <= xNext; nx++){
          votes += personState[row + nx];
        }
      }
      despeckledPerson[y * RENDER_W + x] = votes >= MASK_DESPECKLE_MAJORITY ? 1 : 0;
    }
  }
}

function isBackgroundCell(x, y){
  if (!bgRemoveActive || !latestMask) return false;
  return despeckledPerson[y * RENDER_W + x] === 0;
}

function renderToAscii(){
  // copy either the WebGL canvas or the webcam feed into a normal 2D canvas
  // so we can read its pixels; destination size always forces it to fill
  // the RENDER_W x RENDER_H sample grid regardless of the source's own size.
  if (bgRemoveActive && segmenter) runSegmentation();
  if (webcamActive) {
    const vw = webcamVideo.videoWidth, vh = webcamVideo.videoHeight;
    if (vw && vh) {
      // Most webcams are 16:9; the sample grid is fixed 4:3. Drawing the raw
      // frame straight into a 4:3 box would squash/stretch it, so instead we
      // center-crop the raw frame down to a 4:3 slice before sampling --
      // same idea as CSS object-fit: cover. cropXNorm/cropYNorm/cropWNorm/
      // cropHNorm record that slice (normalized 0..1) so updateBackgroundMask()
      // can sample the segmentation mask -- which is computed from the same
      // *uncropped* raw frame -- through the identical window.
      const targetAspect = RENDER_W / RENDER_H;
      const srcAspect = vw / vh;
      let sx = 0, sy = 0, sw = vw, sh = vh;
      if (srcAspect > targetAspect) {
        sw = vh * targetAspect;      // raw frame is wider than target -> crop the sides
        sx = (vw - sw) / 2;
      } else if (srcAspect < targetAspect) {
        sh = vw / targetAspect;      // raw frame is taller than target -> crop top/bottom
        sy = (vh - sh) / 2;
      }
      cropXNorm = sx / vw; cropYNorm = sy / vh;
      cropWNorm = sw / vw; cropHNorm = sh / vh;
      sctx.drawImage(webcamVideo, sx, sy, sw, sh, 0, 0, RENDER_W, RENDER_H);
    } else {
      // videoWidth/videoHeight aren't populated until the stream's first
      // frame arrives; fall back to a plain stretch-fit for these first
      // couple of frames rather than crashing on a divide-by-zero.
      cropXNorm = 0; cropYNorm = 0; cropWNorm = 1; cropHNorm = 1;
      sctx.drawImage(webcamVideo, 0, 0, RENDER_W, RENDER_H);
    }
  } else {
    cropXNorm = 0; cropYNorm = 0; cropWNorm = 1; cropHNorm = 1;
    sctx.drawImage(renderer.domElement, 0, 0, RENDER_W, RENDER_H);
  }
  updateBackgroundMask();
  const img = sctx.getImageData(0, 0, RENDER_W, RENDER_H).data;
  const mode = colorModeSelect.value;

  // Always draw onto asciiCanvas (even in mono mode, where it stays hidden
  // behind the <pre>) and always build the plain-text grid. This means
  // Screenshot and Copy work identically no matter which display mode is
  // active, instead of only being wired up for one of them.
  // Clear in raw buffer space (transform reset) so it's correct regardless of
  // the scale*dpr transform fitToScreen() left active on the context.
  actx.save();
  actx.setTransform(1, 0, 0, 1, 0, 0);
  actx.clearRect(0, 0, asciiCanvas.width, asciiCanvas.height);
  actx.restore();

  const rows = [];
  for(let y = 0; y < RENDER_H; y++){
    let line = '';
    for(let x = 0; x < RENDER_W; x++){
      // Webcam mode mirrors (when mirrorEnabled) by reading from the flipped source column (sx) but
      // draw/append at the display column (x). This keeps color sampling,
      // the background mask, and luminance smoothing all indexed the same
      // way a plain unmirrored render would be -- only the final on-screen
      // position flips, so glyphs stay upright and never render backwards.
      const sx = (webcamActive && mirrorEnabled) ? (RENDER_W - 1 - x) : x;
      if (isBackgroundCell(sx, y)) { line += ' '; continue; }
      const idx = (y * RENDER_W + sx) * 4; // each pixel is 4 bytes: R,G,B,A
      const r = img[idx], g = img[idx+1], b = img[idx+2];
      const rawLum = (0.299*r + 0.587*g + 0.114*b) / 255;
      let lum = rawLum;
      if (webcamActive) {
        const i = y * RENDER_W + sx;
        smoothedLum[i] = justResized ? rawLum : (smoothedLum[i] * LUM_SMOOTH_KEEP + rawLum * LUM_SMOOTH_NEW);
        lum = smoothedLum[i];
      }
      const ch = RAMP[Math.min(RAMP.length - 1, Math.round(lum * (RAMP.length - 1)))];
      line += ch;
      if (ch === ' ') continue;
      if (mode === 'mono') {
        actx.fillStyle = '#f7f7f7'; // matches #ascii's CSS color
      } else if (mode === 'grey') {
        const v = Math.round(lum * 255);
        actx.fillStyle = `rgb(${v},${v},${v})`;
      } else {
        actx.fillStyle = `rgb(${r},${g},${b})`;
      }
      actx.fillText(ch, x * CELL_W, y * CELL_H);
    }
    rows.push(line);
  }
  lastAsciiText = rows.join('\n');
  if (mode === 'mono') asciiEl.textContent = lastAsciiText;
  justResized = false;
}
function tick(now){
  if (!paused) {
    if (!webcamActive) {
      if (dragging) {
        // rotation is applied directly in handlePointerMove -- nothing to do
        // here, this branch just suppresses auto-rotation while dragging.
      } else if (inertiaActive) {
        shape.rotation.x += inertiaVelX;
        shape.rotation.y += inertiaVelY;
        inertiaVelX *= INERTIA_DECAY;
        inertiaVelY *= INERTIA_DECAY;
        if (Math.abs(inertiaVelX) < INERTIA_STOP_THRESHOLD && Math.abs(inertiaVelY) < INERTIA_STOP_THRESHOLD) {
          inertiaActive = false;
          // Hand off into a blend instead of snapping straight to
          // AUTO_ROTATE_X/Y -- see BLEND_DURATION_MS above.
          beginAutoRotateBlend(inertiaVelX, inertiaVelY, now);
        }
      } else if (blending) {
        const t = Math.min(1, (now - blendStartTime) / BLEND_DURATION_MS);
        shape.rotation.x += blendStartX + (AUTO_ROTATE_X - blendStartX) * t;
        shape.rotation.y += blendStartY + (AUTO_ROTATE_Y - blendStartY) * t;
        if (t >= 1) blending = false; // fully handed off; next frame takes the plain auto-rotate branch
      } else {
        shape.rotation.x += AUTO_ROTATE_X;
        shape.rotation.y += AUTO_ROTATE_Y;
      }
      renderer.render(scene, camera);
    }
    renderToAscii();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const pauseToggle = document.getElementById('pauseToggle');
pauseToggle.addEventListener('click', () => {
  paused = !paused;
  pauseToggle.setAttribute('aria-pressed', String(paused));
  pauseToggle.title = paused ? 'Resume' : 'Pause';
  pauseToggle.setAttribute('aria-label', paused ? 'Resume' : 'Pause');
  pauseToggle.innerHTML = paused ? PLAY_ICON : PAUSE_ICON;
});

const copyBtn = document.getElementById('copyBtn');
copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(lastAsciiText);
    const original = copyBtn.textContent;
    copyBtn.textContent = 'Copied!';
    setTimeout(() => { copyBtn.textContent = original; }, 1200);
  } catch (err) {
    console.error(err);
    showToast('Could not copy — your browser may be blocking clipboard access.');
  }
});

// Mobile has no anchor-download flow worth using -- iOS Safari and Android
// Chrome both ignore <a download> for same-origin blob URLs and just
// navigate to the image instead. Long-press-to-save on a plain <img> is a
// native gesture on both, so mobile gets an overlay showing the PNG instead
// of triggering a download.
const screenshotOverlay = document.getElementById('screenshotOverlay');
const screenshotOverlayImg = document.getElementById('screenshotOverlayImg');
const screenshotOverlayClose = document.getElementById('screenshotOverlayClose');
let screenshotOverlayUrl = null;

function closeScreenshotOverlay(){
  screenshotOverlay.classList.remove('open');
  if (screenshotOverlayUrl) {
    URL.revokeObjectURL(screenshotOverlayUrl);
    screenshotOverlayUrl = null;
  }
  screenshotOverlayImg.src = '';
}

function openScreenshotOverlay(blob){
  closeScreenshotOverlay(); // in case one's already open, revoke its URL before making a new one
  screenshotOverlayUrl = URL.createObjectURL(blob);
  screenshotOverlayImg.src = screenshotOverlayUrl;
  screenshotOverlay.classList.add('open');
}

screenshotOverlayClose.addEventListener('click', closeScreenshotOverlay);
screenshotOverlay.addEventListener('click', (e) => {
  if (e.target === screenshotOverlay) closeScreenshotOverlay(); // backdrop tap, not the content box
});

const screenshotBtn = document.getElementById('screenshotBtn');
screenshotBtn.addEventListener('click', () => {
  // Checked at click time (not cached) since orientation/resize can change
  // which flow applies between one press and the next.
  const isMobile = window.matchMedia('(max-width: 600px)').matches;
  // Composite the (transparent) ascii canvas over an opaque background so the
  // resulting PNG matches what's visible on screen instead of having holes.
  const out = document.createElement('canvas');
  out.width = asciiCanvas.width;
  out.height = asciiCanvas.height;
  const octx = out.getContext('2d');
  octx.fillStyle = '#0b0906'; // matches body background
  octx.fillRect(0, 0, out.width, out.height);
  octx.drawImage(asciiCanvas, 0, 0);
  out.toBlob((blob) => {
    if (!blob) return;
    if (isMobile) {
      openScreenshotOverlay(blob);
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ascii-${Date.now()}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }, 'image/png');
});
})();
</script>
